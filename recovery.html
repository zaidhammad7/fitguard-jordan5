<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>الاستشفاء العضلي | FitGuard Jordan</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}</style></head>
<body class="bg-[#0b1220] text-slate-100 min-h-screen"><div id="nav"></div>
<main class="max-w-5xl mx-auto p-4 space-y-4">
<section class="grid md:grid-cols-2 gap-4">
  <div class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5">
    <h1 class="text-xl font-black mb-2">خريطة الإجهاد</h1>
    <svg viewBox="0 0 200 400" class="mx-auto h-96">
      <circle cx="100" cy="30" r="20" fill="#334155"/>
      <ellipse id="m-shoulders-l" cx="62" cy="75" rx="18" ry="12"/><ellipse id="m-shoulders-r" cx="138" cy="75" rx="18" ry="12"/>
      <rect id="m-chest" x="72" y="68" width="56" height="40" rx="10"/>
      <rect id="m-arms-l" x="36" y="88" width="16" height="70" rx="8"/><rect id="m-arms-r" x="148" y="88" width="16" height="70" rx="8"/>
      <rect id="m-core" x="76" y="112" width="48" height="56" rx="10"/>
      <rect id="m-quads-l" x="72" y="174" width="26" height="90" rx="12"/><rect id="m-quads-r" x="102" y="174" width="26" height="90" rx="12"/>
      <rect id="m-calves-l" x="74" y="272" width="22" height="90" rx="11"/><rect id="m-calves-r" x="104" y="272" width="22" height="90" rx="11"/>
    </svg>
    <p class="text-xs text-slate-400 text-center">أخضر: مرتاحة — أحمر: مجهدة. (الأرداف والفخذ الخلفي والظهر تظهر في القائمة)</p>
  </div>
  <div class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5 space-y-3">
    <h2 class="text-xl font-black">وقت الراحة المقترح</h2>
    <div id="bars" class="space-y-3"></div>
    <div class="flex gap-2 pt-2">
      <button id="demo" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">بيانات تجريبية</button>
      <button id="reset" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">تصفير</button>
    </div>
  </div>
</section>
<script src="js/store.js"></script>
<script>
renderNav('recovery.html');
function draw(){
  document.getElementById('bars').innerHTML = Object.entries(MUSCLES).map(([m,name]) => {
    const f = fatigue(m), h = restHours(m);
    document.querySelectorAll('[id^="m-'+m+'"]').forEach(el => el.setAttribute('fill', heat(f)));
    return `<div><div class="flex justify-between text-sm"><span>${name}</span>
      <span class="text-slate-400">${f}% — ${h ? 'ارتح '+h+' ساعة' : 'جاهزة'}</span></div>
      <div class="h-2.5 rounded-full bg-slate-800 mt-1"><div class="h-full rounded-full" style="width:${f}%;background:${heat(f)}"></div></div></div>`;
  }).join('');
}
document.getElementById('demo').onclick = () => { [['quads',70],['glutes',55],['hams',40],['calves',25],['core',15]].forEach(([m,v])=>addLoad(m,v)); draw(); };
document.getElementById('reset').onclick = () => { const s=getState(); s.load={}; saveState(s); draw(); };
draw(); setInterval(draw, 60000);
</script>
</main></body></html>
