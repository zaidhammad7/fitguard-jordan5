<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>التمرين الذكي | FitGuard Jordan</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}</style></head>
<body class="bg-[#0b1220] text-slate-100 min-h-screen"><div id="nav"></div>
<main class="max-w-5xl mx-auto p-4 space-y-4">
<section class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5 space-y-3">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <h1 class="text-xl font-black">السكوات بالذكاء الاصطناعي</h1>
    <button id="btn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-4 py-2 rounded-xl">شغّل الكاميرا</button>
  </div>
  <p class="text-slate-400 text-sm">قف بحيث يظهر جسمك كاملاً من الجانب. الكاميرا تعمل على https أو localhost فقط، والفيديو لا يُرسل لأي خادم.</p>
  <div id="frame" class="relative rounded-2xl overflow-hidden bg-black border-4 border-slate-700 aspect-video">
    <video id="v" class="absolute inset-0 w-full h-full object-cover -scale-x-100" playsinline muted></video>
    <canvas id="c" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
    <div id="msg" class="absolute top-3 inset-x-3 text-center font-black text-lg rounded-xl py-2 bg-slate-900/80">اضغط "شغّل الكاميرا"</div>
  </div>
  <div class="grid grid-cols-4 gap-2 text-center">
    <div class="bg-slate-900 rounded-xl p-3"><div id="kAng" class="text-2xl font-black">--</div><div class="text-xs text-slate-400">زاوية الركبة</div></div>
    <div class="bg-slate-900 rounded-xl p-3"><div id="kReps" class="text-2xl font-black">0</div><div class="text-xs text-slate-400">التكرارات</div></div>
    <div class="bg-slate-900 rounded-xl p-3"><div id="kGood" class="text-2xl font-black text-emerald-400">0</div><div class="text-xs text-slate-400">تكرارات سليمة</div></div>
    <div class="bg-slate-900 rounded-xl p-3"><div id="kPts" class="text-2xl font-black text-sky-400">+0</div><div class="text-xs text-slate-400">نقاط الجلسة</div></div>
  </div>
</section>
<script src="js/store.js"></script>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
renderNav('workout.html');
const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const $ = id => document.getElementById(id);
const video=$('v'), canvas=$('c'), ctx=canvas.getContext('2d'), msg=$('msg'), frame=$('frame');
let landmarker, stage='up', minAng=180, reps=0, good=0, pts=0, lastT=-1, flashUntil=0, flashText='';

// الزاوية عند النقطة b بين a و c بالدرجات
function angle(a,b,c){
  let d = Math.abs((Math.atan2(c.y-b.y,c.x-b.x) - Math.atan2(a.y-b.y,a.x-b.x)) * 180/Math.PI);
  return d>180 ? 360-d : d;
}
function setStatus(ok, text){
  frame.style.borderColor = ok ? '#22c55e' : '#ef4444';
  msg.textContent = text;
  msg.style.color = ok ? '#4ade80' : '#f87171';
}
function finishRep(){
  reps++;
  const deepEnough = minAng <= 100;
  if (deepEnough){
    good++; pts += 10;
    const s = getState(); s.points += 10; s.reps += 1; s.good += 1; saveState(s);
    addLoad('quads',8); addLoad('glutes',8); addLoad('hams',4); addLoad('calves',2); addLoad('core',2);
    flashText='تكرار سليم +10 نقاط'; 
  } else {
    const s = getState(); s.reps += 1; saveState(s);
    flashText='انزل أكثر: الركبة لم تصل إلى 100°';
  }
  flashUntil = performance.now() + 1500; flashOk = deepEnough;
  minAng = 180;
  $('kReps').textContent=reps; $('kGood').textContent=good; $('kPts').textContent='+'+pts;
}
let flashOk = true;

function loop(){
  if (video.currentTime !== lastT && video.readyState >= 2){
    lastT = video.currentTime;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const res = landmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const p = res.landmarks[0];
    if (p){
      // نختار الجانب الأوضح (يسار أو يمين)
      const vis = i => p[i].visibility ?? 0;
      const left = (vis(23)+vis(25)+vis(27)) >= (vis(24)+vis(26)+vis(28));
      const [sh,hip,kn,an] = left ? [11,23,25,27] : [12,24,26,28];
      const knee = angle(p[hip],p[kn],p[an]);   // زاوية الركبة
      const back = angle(p[sh],p[hip],p[kn]);   // زاوية الجذع (انحناء الظهر)
      $('kAng').textContent = Math.round(knee)+'°';

      if (knee < 140 && stage==='up') stage='down';
      if (stage==='down') minAng = Math.min(minAng, knee);
      if (knee > 160 && stage==='down'){ stage='up'; finishRep(); }

      const now = performance.now();
      let ok = true, text = 'قف مستعداً';
      if (now < flashUntil){ ok = flashOk; text = flashText; }
      else if (back < 50){ ok = false; text = 'ارفع صدرك، ظهرك مائل جداً'; }
      else if (stage==='down'){ ok = true; text = knee<=100 ? 'ممتاز! اصعد الآن' : 'استمر بالنزول'; }
      setStatus(ok, text);

      const color = ok ? '#22c55e' : '#ef4444', du = new DrawingUtils(ctx);
      du.drawConnectors(p, PoseLandmarker.POSE_CONNECTIONS, {color, lineWidth:5});
      du.drawLandmarks(p, {color:'#fff', fillColor:color, radius:4});
    }
  }
  requestAnimationFrame(loop);
}

$('btn').onclick = async () => {
  $('btn').disabled = true; msg.textContent = 'جارٍ تحميل نموذج الذكاء الاصطناعي...';
  try {
    const fs = await FilesetResolver.forVisionTasks(WASM);
    landmarker = await PoseLandmarker.createFromOptions(fs, { baseOptions:{ modelAssetPath: MODEL, delegate:'GPU' }, runningMode:'VIDEO', numPoses:1 });
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 } });
    await video.play(); loop();
  } catch (e) {
    msg.textContent = 'تعذر تشغيل الكاميرا: اسمح بالوصول للكاميرا وافتح الصفحة عبر https أو localhost.';
    $('btn').disabled = false; console.error(e);
  }
};
</script>
</main></body></html>
