<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>الرئيسية | FitGuard Jordan</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}</style></head>
<body class="bg-[#0b1220] text-slate-100 min-h-screen"><div id="nav"></div>
<main class="max-w-5xl mx-auto p-4 space-y-4">
<section class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5">
  <h1 class="text-3xl font-black">أهلاً <span id="nm"></span>، جاهز لتمرين اليوم؟</h1>
  <p class="text-slate-400 mt-1">تمرّن بحركة سليمة، اجمع نقاطاً، واستبدلها بمكافآت من البنك العربي.</p>
  <a href="workout.html" class="inline-block mt-4 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl">ابدأ التمرين بالكاميرا</a>
</section>
<section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3"></section>
<section class="grid md:grid-cols-2 gap-3">
  <a href="recovery.html" class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5 hover:border-sky-500"><h2 class="font-bold">حالة العضلات</h2><p id="rec" class="text-slate-400 text-sm mt-1"></p></a>
  <a href="rewards.html" class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5 hover:border-sky-500"><h2 class="font-bold">مكافآت البنك العربي</h2><p class="text-slate-400 text-sm mt-1">استبدل نقاطك بفاوتشرات اشتراك جيم وخصومات تغذية.</p></a>
</section>
<script src="js/store.js"></script>
<script>
renderNav('index.html');
const s = getState();
document.getElementById('nm').textContent = s.name;
const avgF = Math.round(Object.keys(MUSCLES).reduce((a,m)=>a+fatigue(m),0)/Object.keys(MUSCLES).length);
const score = s.reps ? Math.round(s.good/s.reps*100) : 0;
const box = (v,l,c='text-sky-400') => `<div class="rounded-2xl bg-[#121b2e] border border-slate-800 p-5"><div class="text-3xl font-black ${c}">${v}</div><div class="text-slate-400 text-sm">${l}</div></div>`;
document.getElementById('stats').innerHTML =
  box(s.points,'نقاط البنك العربي') + box(s.reps,'إجمالي التكرارات') +
  box(score+'%','دقة الحركة', score>=70?'text-emerald-400':'text-amber-400') + box((100-avgF)+'%','جاهزية العضلات','text-emerald-400');
document.getElementById('rec').textContent = avgF ? 'متوسط الإجهاد '+avgF+'% — راجع وقت الراحة المقترح.' : 'لا يوجد إجهاد حالياً، جسمك جاهز.';
</script>
</main></body></html>
